name: Build datos.json

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests

      - name: Build public/datos.json
        run: PYTHONPATH=src python -m porra_mundial.build_data --out public/datos.json

      - name: Commit generated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update datos.json"
          file_pattern: public/datos.json
