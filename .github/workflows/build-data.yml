name: Build and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # GitHub Actions usa UTC. Durante el Mundial, Madrid esta en UTC+2.
    # Ejecuciones: 00:30, 03:30, 06:30 y 08:30 Europe/Madrid.
    - cron: "30 1,4,6 * * *"
    - cron: "30 22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build public/datos.json
        env:
          GOOGLE_SHEET_TSV_URL: ${{ secrets.GOOGLE_SHEET_TSV_URL }}
          GOOGLE_OVERRIDES_TSV_URL: ${{ secrets.GOOGLE_OVERRIDES_TSV_URL }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_QUINIELAS_RANGE: quinielas!A:Z
          GOOGLE_OVERRIDES_RANGE: overrides!A:Z
          SPORTSDB_SEASON: "2026"
          PREVIOUS_DATOS_URL: https://abittencourt21.github.io/porra_mundial_2026/datos.json
        run: python -m porra_mundial.build_data --out public/datos.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
