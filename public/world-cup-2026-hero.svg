  <path d="M-20 354 C175 270 318 408 508 338 C702 266 830 374 1018 304 C1106 272 1158 254 1220 264" fill="none" stroke="#00a66a" stroke-width="22" stroke-linecap="round" opacity=".9"/>
  <path d="-10 390 C180 328 330 424 526 374 C722 324 842 410 1018 354 C1104 326 1160 318 1218 332" fill="none" stroke="#e1253b" stroke-width="18" stroke-linecap="round" opacity=".88"/>

