<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Porra Mundial 2026</title>
  <desc id="desc">Cabecera decorativa con una estética clara inspirada en los colores rojo, verde y azul del Mundial 2026.</desc>
  <defs>
    <linearGradient id="page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="52%" stop-color="#f4f7ff"/>
      <stop offset="100%" stop-color="#eaf1ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#b88923"/>
      <stop offset="48%" stop-color="#d9a72f"/>
      <stop offset="100%" stop-color="#f0c65a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#081b46" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="0" fill="url(#page)"/>
  <circle cx="90" cy="35" r="180" fill="#e1253b" opacity=".13"/>
  <circle cx="1095" cy="15" r="220" fill="#0057d8" opacity=".14"/>
  <circle cx="920" cy="420" r="240" fill="#00a66a" opacity=".13"/>

