<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Porra Mundial 2026</title>
  <desc id="desc">Imagen decorativa propia inspirada en futbol, el numero 26 y los colores de Canada, Mexico y Estados Unidos.</desc>
  <defs>
    <radialGradient id="glowRed" cx="18%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#c8102e" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#c8102e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#0a3161" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#0a3161" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="72%" cy="92%" r="55%">
      <stop offset="0%" stop-color="#00833e" stop-opacity=".48"/>
      <stop offset="100%" stop-color="#00833e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#8a7234"/>
      <stop offset="46%" stop-color="#e6c766"/>
      <stop offset="100%" stop-color="#c8a24b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="#0a0a0a"/>
  <rect width="1200" height="420" fill="url(#glowRed)"/>
  <rect width="1200" height="420" fill="url(#glowBlue)"/>
  <rect width="1200" height="420" fill="url(#glowGreen)"/>

  <path d="M0 325 C180 250 305 392 480 315 C682 225 835 338 1000 268 C1092 228 1146 214 1200 222 L1200 420 L0 420 Z" fill="#111" opacity=".72"/>
  <path d="M0 350 C186 278 318 408 502 336 C710 254 840 362 1020 294 C1105 262 1154 246 1200 254" fill="none" stroke="#c8a24b" stroke-opacity=".5" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="92" y="74" width="226" height="226" rx="46" fill="#151515" stroke="url(#gold)" stroke-width="5"/>
    <text x="205" y="232" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="142" fill="url(#gold)">26</text>
    <circle cx="279" cy="114" r="31" fill="#f5f5f5"/>
    <path d="M279 83 L291 106 L318 110 L298 128 L303 155 L279 142 L255 155 L260 128 L240 110 L267 106 Z" fill="#0a0a0a"/>
  </g>

  <text x="372" y="150" font-family="'Arial Black', Impact, sans-serif" font-size="70" fill="#f5f5f5" letter-spacing="-2">PORRA MUNDIAL</text>
  <text x="376" y="215" font-family="'Arial Black', Impact, sans-serif" font-size="74" fill="url(#gold)" letter-spacing="2">2026</text>
  <text x="380" y="262" font-family="Arial, sans-serif" font-size="24" fill="#c9c9c9">Canada · Mexico · Estados Unidos</text>

  <g transform="translate(390 302)">
    <rect width="132" height="42" rx="21" fill="#c8102e"/>
    <rect x="150" width="132" height="42" rx="21" fill="#00833e"/>
    <rect x="300" width="132" height="42" rx="21" fill="#0a3161"/>
    <text x="66" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff" font-weight="700">CAN</text>
    <text x="216" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff" font-weight="700">MEX</text>
    <text x="366" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff" font-weight="700">USA</text>
  </g>

  <g transform="translate(970 72)" opacity=".9">
    <circle cx="78" cy="78" r="70" fill="#f5f5f5"/>
    <path d="M78 22 L99 54 L135 64 L112 94 L114 132 L78 119 L42 132 L44 94 L21 64 L57 54 Z" fill="#151515"/>
    <path d="M78 22 L78 119 M21 64 L135 64 M42 132 L99 54 M114 132 L57 54" stroke="#151515" stroke-width="6" stroke-linecap="round" opacity=".75"/>
  </g>
</svg>
