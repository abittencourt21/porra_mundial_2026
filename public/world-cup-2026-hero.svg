    <text x="0" y="62" font-family="'Arial Black', Impact, sans-serif" font-size="66" fill="#081b46" letter-spacing="-2">PORRA MUNDIAL</text>
    <text x="2" y="132" font-family="'Arial Black', Impact, sans-serif" font-size="76" fill="url(#gold)" letter-spacing="2">2026</text>
