<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porra Mundial 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7ff;
      --surface: #ffffff;
      --surface2: #eef3ff;
      --line: #d8e1f2;
      --gold: #c99a2e;
      --gold-bright: #d9a72f;
      --gold-dim: #b88923;
      --white: #101c3d;
      --muted: #5a6784;
      --dim: #8390aa;
      --can: #e1253b;
      --mex: #00a66a;
      --usa: #0057d8;
      --navy: #081b46;
      --sky: #00a3ff;
      --ok: #00a66a;
      --bad: #d8273f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: var(--white);
      font-family: "Barlow", system-ui, sans-serif;
      background:
        radial-gradient(circle at 8% 0%, rgba(225, 37, 59, .18), transparent 34rem),
        radial-gradient(circle at 92% 2%, rgba(0, 87, 216, .22), transparent 36rem),
        radial-gradient(circle at 75% 100%, rgba(0, 166, 106, .18), transparent 30rem),
        linear-gradient(180deg, #ffffff 0%, #f4f7ff 38%, #eaf1ff 100%),
        var(--bg);
    }

    button { font: inherit; }

    .topbar {
      position: relative;
      z-index: 20;
      border-bottom: 1px solid rgba(8, 27, 70, .08);
      background:
        linear-gradient(90deg, rgba(225,37,59,.16), rgba(0,166,106,.14), rgba(0,87,216,.16)),
        #ffffff;
    }

    .wrap {
      width: min(1080px, calc(100% - 28px));
      margin: 0 auto;
    }

    .brand {
      padding: 14px 0;
      color: transparent;
      font-size: 0;
      line-height: 0;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .emblem {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: 2px solid var(--gold);
      border-radius: 8px;
      color: var(--gold-bright);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
    }

    .brand-hero {
      position: relative;
      min-height: clamp(132px, 21vw, 230px);
      border: 1px solid var(--gold-dim);
      border-radius: 16px;
      overflow: hidden;
      background: var(--navy);
      box-shadow: 0 18px 34px rgba(8, 27, 70, .16);
    }

    .brand-hero-bg {
      display: block;
      width: 100%;
      height: clamp(132px, 21vw, 230px);
      object-fit: cover;
    }

    .brand-emblem {
      position: absolute;
      left: clamp(14px, 3.2vw, 36px);
      top: 50%;
      width: clamp(82px, 14vw, 138px);
      aspect-ratio: 1;
      transform: translateY(-50%);
      border-radius: 18px;
      object-fit: cover;
      box-shadow: 0 18px 34px rgba(8, 27, 70, .24);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .title {
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .title span { color: var(--gold); }

    .meta-line {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .host-dots {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--dim);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .tabs {
      position: sticky;
      top: 0;
      z-index: 19;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .92);
      backdrop-filter: blur(14px);
    }

    .tab-list {
      display: flex;
      overflow-x: auto;
    }

    .tab {
      flex: 0 0 auto;
      border: 0;
      border-bottom: 2px solid transparent;
      padding: 10px 14px;
      color: var(--muted);
      background: none;
      cursor: pointer;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .tab.active {
      color: var(--usa);
      border-bottom-color: var(--usa);
    }

    main {
      padding: 18px 0 34px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      margin-bottom: 16px;
      border: 1px solid var(--gold-dim);
      border-radius: 14px;
      padding: 16px 18px;
      background:
        linear-gradient(135deg, rgba(0, 87, 216, .10), rgba(0, 166, 106, .08) 52%, rgba(225, 37, 59, .09)),
        var(--surface);
      box-shadow: 0 18px 36px rgba(8, 27, 70, .10);
    }

    .hero h1 {
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(34px, 7vw, 56px);
      line-height: .9;
      letter-spacing: -.02em;
      text-transform: uppercase;
    }

    .hero p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .hero-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(110px, 1fr));
      gap: 10px;
    }

    .hero-stat {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: rgba(255,255,255,.72);
    }

    .hero-stat strong {
      display: block;
      color: var(--gold-bright);
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(28px, 6vw, 42px);
      line-height: .95;
      white-space: nowrap;
    }

    .hero-stat.prize-split strong {
      color: var(--usa);
      font-size: clamp(26px, 4.6vw, 38px);
    }

    .hero-stat span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    .hero-stats p, .prize[hidden] { display: none; }

    .prize {
      text-align: right;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .prize strong {
      color: var(--gold-bright);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 24px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 12px 28px rgba(8, 27, 70, .08);
      overflow: hidden;
    }

    .section-note {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .stack { display: flex; flex-direction: column; gap: 10px; }

    .ranking-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(8, 27, 70, .07);
      transition: border-color .15s ease, transform .15s ease;
    }

    .ranking-card:hover {
      border-color: var(--gold-dim);
      transform: translateY(-1px);
    }

    .ranking-head {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      gap: 12px;
      align-items: center;
      width: 100%;
      border: 0;
      padding: 12px 14px;
      color: inherit;
      background: none;
      cursor: pointer;
      text-align: left;
    }

    .rank {
      color: var(--gold);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 26px;
      font-weight: 800;
      text-align: center;
    }

    .alias {
      font-family: "Barlow Condensed", sans-serif;
      font-size: 22px;
      font-weight: 700;
    }

    .teams {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 5px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--muted);
      background: #f8fbff;
      font-size: 11px;
      white-space: nowrap;
    }

    .score {
      text-align: right;
      color: var(--gold-bright);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 32px;
      font-weight: 800;
      line-height: .9;
    }

    .score span {
      display: block;
      margin-top: 4px;
      color: var(--dim);
      font-family: "Barlow", sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .details {
      display: none;
      border-top: 1px solid var(--line);
      padding: 12px 14px 14px;
    }

    .ranking-card.open .details { display: block; }

    .breakdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 10px;
      background: var(--surface2);
    }

    .metric label {
      display: block;
      color: var(--dim);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .metric strong {
      color: var(--gold-bright);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 22px;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
    }

    .team-card {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px;
      background: #f8fbff;
    }

    .team-card h3 {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--white);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 17px;
      font-weight: 700;
    }

    .team-card small {
      color: var(--muted);
      font-size: 11px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      padding: 9px 8px;
      color: #ffffff;
      background: var(--navy);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .8px;
      text-align: left;
      text-transform: uppercase;
    }

    td {
      padding: 8px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      vertical-align: middle;
    }

    td.num, th.num { text-align: right; }
    td.center, th.center { text-align: center; }

    .team-name { color: var(--white); font-weight: 600; }
    .gold { color: var(--gold-bright); font-weight: 700; }
    .dim { color: var(--dim); }
    .left { text-align: left; }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }

    .toolbar-label {
      margin-right: 2px;
      color: var(--dim);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .filter {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 5px 10px;
      color: var(--muted);
      background: var(--surface);
      cursor: pointer;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 12px;
      font-weight: 700;
    }

    .filter.active {
      border-color: var(--usa);
      color: #ffffff;
      background: var(--usa);
    }

    .match-row {
      display: grid;
      grid-template-columns: 72px 1fr auto 1fr;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 11px;
      background: var(--surface);
      font-size: 13px;
    }

    .match-date { color: var(--dim); font-size: 11px; }
    .home { text-align: right; color: var(--white); }
    .away { color: var(--white); }
    .result {
      min-width: 54px;
      border-radius: 7px;
      padding: 5px 8px;
      color: var(--gold-bright);
      background: #eef4ff;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
    }

    .date-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 7px;
      color: var(--muted);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .date-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .pot-1 { color: var(--usa); }
    .pot-2 { color: var(--mex); }
    .pot-3 { color: var(--can); }
    .pot-4 { color: var(--gold-dim); }

    .flag {
      width: 22px;
      height: 15px;
      object-fit: cover;
      border-radius: 3px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.16);
      background: var(--line);
      vertical-align: -2px;
    }

    .team-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: inherit;
    }

    .rules {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
    }

    .rules-block {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 12px 28px rgba(8, 27, 70, .08);
    }

    .rules-hero {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 18px;
      align-items: center;
      border: 1px solid var(--gold-dim);
      border-radius: 16px;
      padding: 18px;
      background:
        linear-gradient(135deg, rgba(0, 87, 216, .14), rgba(0,166,106,.12) 50%, rgba(225,37,59,.12)),
        var(--surface);
    }

    .hero[hidden] { display: none; }

    .hero-art {
      width: 100%;
      height: 130px;
      border: 1px solid rgba(200, 162, 75, .35);
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 16px 28px rgba(8, 27, 70, .14);
    }

    .rules-hero h2 {
      color: var(--white);
      font-family: "Barlow Condensed", sans-serif;
      font-size: clamp(34px, 6vw, 58px);
      line-height: .92;
      text-transform: uppercase;
    }

    .rules-hero p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    .rules-hero a {
      color: var(--usa);
      font-weight: 800;
      text-decoration-thickness: 2px;
      text-underline-offset: 3px;
    }

    .rules-kpi {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .rules-kpi div {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: rgba(255,255,255,.76);
    }

    .rules-kpi strong {
      display: block;
      color: var(--gold-bright);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 28px;
      line-height: 1;
    }

    .rules-kpi span {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .rules-wide { grid-column: span 8; }
    .rules-side { grid-column: span 4; }
    .rules-half { grid-column: span 6; }
    .rules-full { grid-column: 1 / -1; }

    .rules-block h2 {
      margin-bottom: 8px;
      color: var(--gold-bright);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 24px;
      text-transform: uppercase;
    }

    .rules-block p, .rules-block li {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .rules-block ul {
      margin-left: 18px;
    }

    .rules-table {
      width: 100%;
      margin-top: 10px;
    }

    .rules-table td, .rules-table th {
      padding: 8px 10px;
    }

    .points-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .point-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #f8fbff;
      text-align: center;
    }

    .point-card strong {
      display: block;
      color: var(--gold-bright);
      font-family: "Barlow Condensed", sans-serif;
      font-size: 34px;
      line-height: 1;
    }

    .point-card span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 18px;
      color: var(--muted);
      background: rgba(255, 255, 255, .72);
    }

    .footer {
      padding: 18px 0 24px;
      color: var(--dim);
      font-size: 10px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .brand { align-items: flex-start; }
      .host-dots { display: none; }
      .brand-emblem {
        left: 14px;
        width: clamp(70px, 18vw, 96px);
      }
      .tabs { top: 0; }
      .hero { grid-template-columns: 1fr; }
      .hero-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .hero-art { height: 120px; }
      .prize { text-align: left; }
      .ranking-head { grid-template-columns: 34px 1fr auto; }
      .breakdown { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .match-row { grid-template-columns: 1fr auto 1fr; }
      .match-date { display: none; }
      .rules, .rules-hero { grid-template-columns: 1fr; }
      .rules-wide, .rules-side, .rules-half { grid-column: 1 / -1; }
      .points-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      .brand-emblem { display: none; }
      .hero-stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="wrap brand">
      <div class="brand-hero">
        <img class="brand-hero-bg" src="world-cup-2026-hero.svg" alt="Porra Mundial 2026">
        <img class="brand-emblem" src="FIFA-World-Cup-26-Logo-Vector-730x730.jpg" alt="FIFA World Cup 26">
      </div>
      <div id="metaLine" class="sr-only">Cargando datos...</div>

  <nav class="tabs">
    <div id="tabs" class="wrap tab-list"></div>

  <main class="wrap">
    <section id="hero" class="hero"></section>
    <section id="app"></section>

      .then((response) => {

        document.querySelector("#metaLine").textContent = "No se pudo cargar datos.json";

        document.querySelector("#app").innerHTML = `<div class="empty">Pendiente de generar datos desde GitHub Actions.</div>`;

    function normalizePayload(data) {
      return {
        meta: data.meta || {},
        participantes: data.participantes || data.participants || [],
        partidos: (data.partidos || data.matches || []).map(normalizeMatch),
        goleadores: data.goleadores || [],
      };
    }

    function normalizeMatch(match) {
      if (Array.isArray(match)) {
        const [matchid, group, roundnumber, fecha, home, away, hs, as, pasa, ronda] = match;
        return {
          matchid,
          group,
          roundnumber,
          ronda,
          fecha,
          home_team: home,
          away_team: away,
          home_score: hs,
          away_score: as,
          home_score_90: hs,
          away_score_90: as,
          pasa,
          status: "FT",
        };
      }
      return {
        ...match,
        fecha: match.fecha || match.date || match.dateEvent || "",
        group: match.group || null,
        roundnumber: match.roundnumber || null,
        ronda: match.ronda || "grupos",
      };
    }

        partidos: renderMatches,
        bombos: renderBombos,
        reglas: renderRules,

      bindEvents();

    function computeTeamScores() {
      const teamGroups = teamGroupMap();
      const teams = CANONICAL_TEAMS.map(({ team, bombo }) => ({
        team,
        bombo,
        group: teamGroups[cleanTeam(team)] || teamGroups[looseTeamKey(team)] || "",
        grupos: 0,
        ko_resultado: 0,
        ko_pase: 0,
        total: 0,
      }));
      const byName = {};
      teams.forEach((team) => {
        byName[cleanTeam(team.team)] = team;
        byName[looseTeamKey(team.team)] = team;
      });
      DATA.partidos.forEach((match) => {
        [match.home_team, match.away_team].forEach((teamName) => {
          const row = byName[cleanTeam(teamName)] || byName[looseTeamKey(teamName)];
          if (!row) return;
          const [gf, gc] = goalsFor(match, teamName, match.ronda !== "grupos");
          const points = resultPoints(gf, gc);
          if (match.ronda === "grupos") row.grupos += points;
          else {
            row.ko_resultado += points;
            if (looseTeamKey(match.pasa) === looseTeamKey(teamName)) row.ko_pase += row.bombo;
          }
          row.total = row.grupos + row.ko_resultado + row.ko_pase;
        });
      });
      return teams;
    }

    function selectionGroups() {
      return [...new Set(computeTeamScores().map((team) => team.group).filter(Boolean))].sort();
    }

    function teamGroupMap() {
      const groups = {};
      DATA.partidos
        .filter((match) => match.group)
        .forEach((match) => {
          groups[cleanTeam(match.home_team)] = match.group;
          groups[cleanTeam(match.away_team)] = match.group;
          groups[looseTeamKey(match.home_team)] = match.group;
          groups[looseTeamKey(match.away_team)] = match.group;
        });
      return groups;
    }

    function standings(group) {
      const rows = {};
      DATA.partidos.filter((match) => match.group === group).forEach((match) => {
        [match.home_team, match.away_team].forEach((team) => {
          if (!rows[team]) rows[team] = { team, PJ: 0, G: 0, E: 0, P: 0, GF: 0, GC: 0, Pts: 0 };
        });
        const hs = scoreValue(match.home_score);
        const as = scoreValue(match.away_score);
        if (hs === null || as === null) return;
        const home = rows[match.home_team];
        const away = rows[match.away_team];
        home.PJ++; away.PJ++;
        home.GF += hs; home.GC += as;
        away.GF += as; away.GC += hs;
        if (hs > as) { home.G++; home.Pts += 3; away.P++; }
        else if (as > hs) { away.G++; away.Pts += 3; home.P++; }
        else { home.E++; away.E++; home.Pts++; away.Pts++; }
      });
      return Object.values(rows).sort((a, b) =>
        b.Pts - a.Pts || (b.GF - b.GC) - (a.GF - a.GC) || b.GF - a.GF || a.team.localeCompare(b.team)
      );
    }

    function bindEvents() {
      document.querySelectorAll("[data-tab]").forEach((button) => {
        button.addEventListener("click", () => {
          activeTab = button.dataset.tab;
          render();
        });
      });
      document.querySelectorAll("[data-open]").forEach((button) => {
        button.addEventListener("click", () => {
          openAlias = openAlias === button.dataset.open ? null : button.dataset.open;
          render();
        });
      });
      document.querySelectorAll("[data-bombo]").forEach((button) => {
        button.addEventListener("click", () => {
          selectionBombo = Number(button.dataset.bombo);
          render();
        });
      });
      document.querySelectorAll("[data-selection-group]").forEach((button) => {
        button.addEventListener("click", () => {
          selectionGroup = button.dataset.selectionGroup;
          render();
        });
      });
      document.querySelectorAll("[data-group]").forEach((button) => {
        button.addEventListener("click", () => {
          groupFilter = button.dataset.group;
          render();
        });
      });
      document.querySelectorAll("[data-round]").forEach((button) => {
        button.addEventListener("click", () => {
          roundFilter = Number(button.dataset.round);
          render();
        });
      });
      document.querySelectorAll("[data-koround]").forEach((button) => {
        button.addEventListener("click", () => {
          koRound = button.dataset.koround;
          render();
        });
      });
    }

    function buttonFilter(kind, value, label, active) {
      return `<button class="filter ${String(active) === String(value) ? "active" : ""}" data-${kind}="${escapeAttr(value)}">${escapeHtml(label)}</button>`;
    }

    function resultPoints(gf, gc) {
      if (gf === null || gc === null) return 0;
      if (gf > gc) return 3;
      if (gf === gc) return 1;
      return 0;
    }

    function goalsFor(match, team, use90) {
      const home = scoreValue(use90 ? match.home_score_90 : match.home_score);
      const away = scoreValue(use90 ? match.away_score_90 : match.away_score);
      if (match.home_team === team) return [home, away];
      return [away, home];
    }

    function getBombo(team) {
      return BOMBO_MAP[cleanTeam(team)] || 0;
    }

    function cleanTeam(team) {
      return String(team || "").replace(/\*+/g, "").trim();
    }

    function looseTeamKey(team) {
      return cleanTeam(team)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function teamLabel(team) {
      const cleaned = cleanTeam(team);
      const code = FLAGS[cleaned] || FLAGS[String(team || "")];
      const suffix = String(team || "").includes("**") ? "**" : String(team || "").includes("*") ? "*" : "";
      const flag = code ? `<img class="flag" src="https://flagcdn.com/w40/${code}.png" alt="">` : "";
      return `<span class="team-label">${flag}<span>${escapeHtml(cleaned)}${suffix}</span></span>`;
    }

    function scoreValue(value) {
      return value === null || value === undefined || value === "" ? null : Number(value);
    }

    function groupBy(items, fn) {
      return items.reduce((acc, item) => {
        const key = fn(item);
        (acc[key] = acc[key] || []).push(item);
        return acc;
      }, {});
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }
  </script>
</body>
</html>
